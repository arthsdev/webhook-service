spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      url: ${REDIS_URL}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
  flyway:
    enabled: true

logging:
  level:
    com.artheus.webhookservice.shared.stream: DEBUG

delivery-service:
  base-url: ${DELIVERY_SERVICE_URL}
  connect-timeout: ${DELIVERY_SERVICE_CONNECT_TIMEOUT:2s}
  read-timeout: ${DELIVERY_SERVICE_READ_TIMEOUT:10s}

event-stream:
  deliveries-key: ${EVENT_STREAM_DELIVERIES_KEY:webhook.deliveries.requested}